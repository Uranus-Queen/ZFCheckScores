# 工作流的名称
name: CheckScores

# 工作流运行的名称
run-name: ${{ github.workflow }} ${{ github.sha }}

# 指定此工作流的触发器
on:
  schedule:
    # 只在期末季运行（12/1/2 月 = 秋季学期期末，6/7/8 月 = 春季学期期末），
    # 每 30 分钟一次；平时不跑，需要时随时可手动 Run workflow。
    # 想全年运行改回 "*/30 * * * *" 即可（公共仓库 Actions 不限时长）。
    - cron: "*/30 * * 1,2,6,7,8,12 *"
  workflow_dispatch: # 可以手动执行
    inputs:
      force_push_message:
        description: "Whether or not to force a push message?"
        required: true
        default: "False"
        type: choice
        options:
          - "True"
          - "False"

jobs:
  CheckScores:
    name: CheckScores
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        env:
          GOPROXY: "https://goproxy.cn,direct"
          GOTOOLCHAIN: "auto"
        run: |
          go build -ldflags="-s -w" -o zfcheckscores .

      - name: Test
        env:
          GOPROXY: "https://goproxy.cn,direct"
          GOTOOLCHAIN: "auto"
        run: |
          go test -v ./...

      - name: Run main program
        id: run_main_program
        env:
          GOPROXY: "https://goproxy.cn,direct"
          FORCE_PUSH_MESSAGE: ${{ github.event.inputs.force_push_message }}
          GITHUB_ACTIONS: ${{github.actions}}
          URL: ${{ secrets.URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GRADES_DOMAIN: ${{ secrets.GRADES_DOMAIN }}
          GRADES_KEY: ${{ secrets.GRADES_KEY }}
          COOKIES: ${{ secrets.COOKIES }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          # 判断环境变量是否为空
          if [ -z "$URL" ]; then
            echo "URL Secret is empty!"
            echo "::error title=URL Secret is empty!" \
            "::Your 'URL' Secret is not filled with any" \
            "information, so your program will not work!"
            Whether_Secret_is_empty=true
          fi
          if [ -z "$USERNAME" ] && [ -z "$COOKIES" ]; then
            echo "USERNAME and COOKIES Secret are both empty! At least one required."
            echo "::error title=Login credentials missing!" \
            "::Must provide either USERNAME+PASSWORD or COOKIES."
            Whether_Secret_is_empty=true
          fi
          if [ -z "$SERVERCHAN_SENDKEY" ]; then
            echo "SERVERCHAN_SENDKEY Secret is empty!"
            echo "::error title=SERVERCHAN_SENDKEY Secret is empty!" \
            "::Your 'SERVERCHAN_SENDKEY' Secret (Server酱 SendKey) is not" \
            "filled, so the grade-update notification cannot be sent!"
            Whether_Secret_is_empty=true
          fi
          # GRADES_DOMAIN 与 GRADES_KEY 必须成对出现：GRADES_KEY 是 AES-256-GCM
          # 端到端加密密钥（通知链接形如 https://<域名>/#<密钥>，密钥只在 URL
          # # 片段里，不上服务器、不进仓库），缺密钥会把成绩明文写进 KV
          # （任何人可拉取），缺域名则通知里没有可点击的链接。
          # 两者都不填则视为「不启用自托管页」，允许通过。
          # 自托管页数据经 data/payload.json → Cloudflare Workers KV 投递，
          # 因此启用自托管页时还需要 CLOUDFLARE_API_TOKEN（Workers KV 写权限）。
          if [ -n "$GRADES_DOMAIN" ] || [ -n "$GRADES_KEY" ]; then
            if [ -z "$GRADES_DOMAIN" ] || [ -z "$GRADES_KEY" ]; then
              echo "GRADES_DOMAIN and GRADES_KEY must be set together!"
              echo "::error title=GRADES_DOMAIN / GRADES_KEY 不匹配!" \
              "::自托管成绩页需要两者成对：GRADES_KEY 是端到端加密密钥（免登录），" \
              "GRADES_DOMAIN 决定域名。请同时设置或同时留空。"
              Whether_Secret_is_empty=true
            fi
          fi
          if [ "$Whether_Secret_is_empty" = true ]; then
            echo "One or more Secrets are empty."
            exit 1
          fi

          if [ -z "${{ github.event.inputs.force_push_message }}" ]; then
            export FORCE_PUSH_MESSAGE="False"
          else
            export FORCE_PUSH_MESSAGE="${{ github.event.inputs.force_push_message }}"
          fi
          export BEIJING_TIME="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S:%3N')"
          echo "BEIJING_TIME=$BEIJING_TIME" >> $GITHUB_OUTPUT

          # 脱敏函数
          mask_middle() {
            local input=$1
            local length=${#input}
            if [ $length -le 3 ]; then
              echo $(printf '%*s' $length | tr ' ' '*')
            else
              local first=${input:0:1}
              local last=${input: -1}
              local middle_length=$((length - 2))
              local middle=$(printf '%*s' $middle_length | tr ' ' '*')
              echo "${first}${middle}${last}"
            fi
          }

          anonymize_domain() {
            local url=$1
            local protocol=$(echo "$url" | sed -n 's#^\(.*://\).*#\1#p')
            local rest=$(echo "${url#*://}")
            local domain=$(echo "$rest" | sed 's#/.*##')
            local path=$(echo "$rest" | sed 's#^[^/]*##')
            IFS='.' read -r -a domain_parts <<< "$domain"
            local anonymized_domain=""
            for part in "${domain_parts[@]}"; do
              anonymized_domain+=$(printf '%*s' ${#part} | tr ' ' '*'). 
            done
            anonymized_domain=${anonymized_domain%.}
            echo "${protocol}${anonymized_domain}${path}"
          }

          LOGINURL="xtgl/login_slogin.html"

          echo "Url: $(anonymize_domain "$URL")${LOGINURL}"
          echo "Username: $(mask_middle "$USERNAME")"
          echo "Force Push Message: $FORCE_PUSH_MESSAGE"
          echo "Branch Name: $GITHUB_REF_NAME"
          echo "Triggered By: $GITHUB_EVENT_NAME"
          echo "Initial Run By: $GITHUB_ACTOR"
          echo "Initial Run By ID: $GITHUB_ACTOR_ID"
          echo "Initiated Run By: $GITHUB_TRIGGERING_ACTOR"
          echo "Repository Name: $REPOSITORY_NAME"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Workflow Name: $GITHUB_WORKFLOW"
          echo "Workflow Number: $GITHUB_RUN_NUMBER"
          echo "Workflow ID: $GITHUB_RUN_ID"
          echo "Beijing Time: $BEIJING_TIME"
          echo "Copyright © 2024 NianBroken. All rights reserved."
          echo "------"

          ./zfcheckscores

      # 成绩数据投递：把加密信封写进 Cloudflare Workers KV。
      # Worker 壳（web/）只有代码变更时才需要重新 deploy，这里每轮只做
      # 1 次 KV 写（免费额度 1000 写/天），与站点构建/部署完全解耦。
      - name: Push payload to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b3c58e6b5b37f48dca4b48324c1d103"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未设置，跳过 KV 上传（自托管成绩页不会更新）。"
            exit 0
          fi
          if [ ! -f data/payload.json ]; then
            echo "本轮未产出 data/payload.json（成绩无变化），跳过 KV 上传。"
            exit 0
          fi
          # 仅当 payload 本轮发生变化（新文件或内容更新）时才写 KV
          if git ls-files --error-unmatch data/payload.json >/dev/null 2>&1 \
             && git diff --quiet -- data/payload.json; then
            echo "data/payload.json 与上轮一致，跳过 KV 上传。"
            exit 0
          fi
          npx --yes wrangler@4 kv key put payload \
            --path data/payload.json \
            --namespace-id e11eae3473714e528dd04d5eb9dca11c \
            --remote
          echo "已写入 KV：namespace GRADES_KV / key payload"

      - name: Commit and push state (data persistence)
        run: |
          git add .
          git commit -m "Update from GitHub Actions" || true
          git pull --rebase origin $GITHUB_REF_NAME || true
          git push origin $GITHUB_REF_NAME
